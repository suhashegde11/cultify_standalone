name: Check Cult.fit Cookies

on:
  schedule:
    - cron: '45 6 * * *' # 3:30 AM UTC i.e 9:00 AM IST - daily cookie health check
  workflow_dispatch:

jobs:
  check-cookies:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check cookie validity
        env:
          CURL_COMMAND: ${{ secrets.CURL_COMMAND }}
          COOKIES: ${{ secrets.COOKIES }}
        run: bun check-cookies.js
